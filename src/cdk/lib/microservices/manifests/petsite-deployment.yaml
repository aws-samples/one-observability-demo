---
apiVersion: v1
kind: Namespace
metadata:
    name: {{ NAMESPACE }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ SERVICE_ACCOUNT_NAME }}
    namespace: {{ NAMESPACE }}
---
apiVersion: v1
kind: Service
metadata:
    name: service-petsite
    namespace: {{ NAMESPACE }}
    annotations:
        scrape: 'true'
        prometheus.io/scrape: 'true'
spec:
    ports:
        - port: {{ CONTAINER_PORT }}
          nodePort: 30300
          targetPort: 8080
          protocol: TCP
    type: NodePort
    selector:
        app: petsite
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: petsite-frontend-dotnet
    namespace: {{ NAMESPACE }}
spec:
    selector:
        matchLabels:
            app: petsite
    replicas: 2
    template:
        metadata:
            labels:
                app: petsite
            annotations:
                instrumentation.opentelemetry.io/inject-dotnet: "true"
                # Changes each deploy so k8s rolls the pods and re-pulls :latest.
                petfood.dev/redeploy-token: "{{ REDEPLOY_TOKEN }}"
        spec:
            serviceAccountName: {{ SERVICE_ACCOUNT_NAME }}
            containers:
                - image: '{{ ECR_IMAGE_URL }}'
                  imagePullPolicy: Always
                  name: petsite
                  ports:
                      - containerPort: 8080
                        protocol: TCP
                  env:
                      - name: PARAMETER_STORE_PREFIX
                        value: {{ PARAMETER_STORE_PREFIX }}
                      - name: PET_HISTORY_URL_PARAM_NAME
                        value: {{ PET_HISTORY_URL_PARAM_NAME }}
                      - name: PET_LIST_ADOPTIONS_URL_PARAM_NAME
                        value: {{ PET_LIST_ADOPTIONS_URL_PARAM_NAME }}
                      - name: CLEANUP_ADOPTIONS_URL_PARAM_NAME
                        value: {{ CLEANUP_ADOPTIONS_URL_PARAM_NAME }}
                      - name: PAYMENT_API_URL_PARAM_NAME
                        value: {{ PAYMENT_API_URL_PARAM_NAME }}
                      - name: FOOD_API_URL_PARAM_NAME
                        value: {{ FOOD_API_URL_PARAM_NAME }}
                      - name: CART_API_URL_PARAM_NAME
                        value: {{ CART_API_URL_PARAM_NAME }}
                      - name: SEARCH_API_URL_PARAM_NAME
                        value: {{ SEARCH_API_URL_PARAM_NAME }}
                      - name: RUM_SCRIPT_PARAMETER_NAME
                        value: {{ RUM_SCRIPT_PARAMETER_NAME }}
                      - name: WAGGLE_AI_RUNTIME_ARN_PARAM_NAME
                        value: {{ WAGGLE_AI_RUNTIME_ARN_PARAM_NAME }}
                      - name: OTEL_RESOURCE_ATTRIBUTES
                        value: 'service.name=petsite-frontend-dotnet,service.namespace=petadoptions,deployment.environment=eks:{{ EKS_CLUSTER_NAME }}'
                      - name: RESOURCE_DETECTORS_ENABLED
                        value: 'false'
                      # Export the custom PetSite meter (Telemetry/PetSiteMetrics.cs) over OTLP to the
                      # CloudWatch agent's OTLP receiver. The injected auto-instrumentation keeps
                      # these values instead of its OTEL_METRICS_EXPORTER=none default.
                      - name: OTEL_METRICS_EXPORTER
                        value: 'otlp'
                      - name: OTEL_DOTNET_AUTO_METRICS_ADDITIONAL_SOURCES
                        value: 'PetSite'
                      - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
                        value: 'http://cloudwatch-agent.amazon-cloudwatch:4318/v1/metrics'
                      - name: OTEL_EXPORTER_OTLP_METRICS_PROTOCOL
                        value: 'http/protobuf'
                      - name: OTEL_METRIC_EXPORT_INTERVAL
                        value: '60000'
                      # Export only the custom meter: built-in HTTP/Kestrel metrics duplicate what
                      # Application Signals already provides. Keep runtime instrumentation enabled;
                      # Application Signals' .NET runtime metrics depend on it.
                      - name: OTEL_DOTNET_AUTO_METRICS_ASPNETCORE_INSTRUMENTATION_ENABLED
                        value: 'false'
                      - name: OTEL_DOTNET_AUTO_METRICS_HTTPCLIENT_INSTRUMENTATION_ENABLED
                        value: 'false'
                      - name: AWS_PAGER
                        value: ''
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: petsite-tgb
  namespace: {{ NAMESPACE }}
spec:
  serviceRef:
    name: service-petsite
    port: 8080
  targetGroupARN: {{ TARGET_GROUP_ARN }}
  targetType: ip
