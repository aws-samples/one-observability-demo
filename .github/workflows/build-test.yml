name: Build Test
permissions:
    contents: read
on:
    pull_request:
        branches: [main, staging, feat/cdkpipeline]
    push:
        branches: [main, staging, feat/cdkpipeline]
jobs:
    docker-builds:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service:
                    - name: payforadoption-go
                      path: src/applications/microservices/payforadoption-go
                    - name: petfood-rs
                      path: src/applications/microservices/petfood-rs
                    - name: petlistadoptions-py
                      path: src/applications/microservices/petlistadoptions-py
                    - name: petsearch-java
                      path: src/applications/microservices/petsearch-java
                    - name: petsite-net
                      path: src/applications/microservices/petsite-net/petsite
        steps:
            - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2

            - name: Build ${{ matrix.service.name }}
              uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
              with:
                  context: ${{ matrix.service.path }}
                  push: false
                  load: true
                  tags: ${{ matrix.service.name }}:test
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    nodejs-builds:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service:
                    - name: petfood-cleanup-processor
                      path: src/applications/lambda/petfood-cleanup-processor-node/
                      node-version: '22'
                    - name: petstatusupdater
                      path: src/applications/lambda/petstatusupdater-node/
                      node-version: '22'
                    - name: traffic-generator
                      path: src/applications/lambda/traffic-generator-node/
                      node-version: '22'

        steps:
            - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

            - name: Setup Node.js
              uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
              with:
                  node-version: ${{ matrix.service.node-version }}
                  cache: 'npm'
                  cache-dependency-path: ${{ matrix.service.path }}/package-lock.json

            - name: Install dependencies
              run: npm ci
              working-directory: ${{ matrix.service.path }}

            - name: Run tests
              run: npm test
              working-directory: ${{ matrix.service.path }}

            - name: Verify build
              run: npm run build --if-present
              working-directory: ${{ matrix.service.path }}

    python-builds:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service:
                    - name: petfood-image-generator
                      path: src/applications/lambda/petfood-image-generator-python/
                      python-version: '3.13'

        steps:
            - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

            - name: Setup Python
              uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
              with:
                  python-version: ${{ matrix.service.python-version }}

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
              working-directory: ${{ matrix.service.path }}

            - name: Run tests
              run: pytest
              working-directory: ${{ matrix.service.path }}

    dotnet-builds:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                project:
                    - name: petsite
                      path: src/applications/microservices/petsite-net/petsite.sln
        steps:
            - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

            - name: Setup .NET
              uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3
              with:
                  dotnet-version: '8.0.x'

            - name: Restore dependencies
              run: dotnet restore ${{ matrix.project.path }}

            - name: Build
              run: dotnet build ${{ matrix.project.path }} --no-restore
